<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenPedia - Eco Encyclopedia Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2d6a4f; --primary-light: #40916c; --primary-dark: #1b4332;
            --accent: #d4a373; --accent-light: #e9c46a;
            --bg-light: #fefae0; --bg-cream: #f8f4e8; --bg-sand: #e9e5d6;
            --text-dark: #1b1b1b; --text-muted: #5c5c5c;
            --success: #52b788; --danger: #e63946; --warning: #f4a261;
            --glass-bg: rgba(255, 255, 255, 0.85); --glass-border: rgba(255, 255, 255, 0.3);
            --shadow: rgba(27, 67, 50, 0.1);
            --gradient-1: linear-gradient(135deg, #2d6a4f 0%, #40916c 50%, #52b788 100%);
            --gradient-2: linear-gradient(135deg, #1b4332 0%, #2d6a4f 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-cream); color: var(--text-dark); line-height: 1.6; overflow-x: hidden; }
        
        nav { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; padding: 1rem 2rem; background: var(--glass-bg); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 30px var(--shadow); }
        .logo { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 0.5rem; cursor: pointer; text-decoration: none; }
        .logo-icon { font-size: 1.8rem; }
        .nav-links { display: flex; gap: 0.5rem; align-items: center; }
        .nav-btn { padding: 0.6rem 1.2rem; border-radius: 50px; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.3s ease; border: none; background: transparent; color: var(--text-dark); }
        .nav-btn:hover { background: var(--primary-light); color: white; }
        .nav-btn.active { background: var(--gradient-1); color: white; }
        .nav-btn.primary { background: var(--gradient-1); color: white; }
        .nav-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(45, 106, 79, 0.3); }
        .nav-right { display: flex; align-items: center; gap: 1rem; }
        .notification-btn { position: relative; width: 40px; height: 40px; border-radius: 50%; background: var(--bg-sand); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; transition: all 0.3s ease; }
        .notification-btn:hover { background: var(--primary-light); color: white; }
        .notification-badge { position: absolute; top: -5px; right: -5px; width: 20px; height: 20px; background: var(--danger); color: white; border-radius: 50%; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--gradient-1); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; cursor: pointer; transition: transform 0.3s ease; }
        .user-avatar:hover { transform: scale(1.1); }
        .main-container { max-width: 1200px; margin: 0 auto; padding: 6rem 1rem 2rem; }
        .page { display: none; }
        .page.active { display: block; }
        .feed-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
        .feed-title { font-family: 'Space Grotesk', sans-serif; font-size: 2rem; font-weight: 700; color: var(--text-dark); }
        .feed-filters { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .filter-btn { padding: 0.5rem 1rem; border-radius: 50px; border: 2px solid var(--glass-border); background: transparent; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: all 0.3s ease; color: var(--text-dark); }
        .filter-btn:hover, .filter-btn.active { background: var(--gradient-1); border-color: transparent; color: white; }
        .articles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem; }
        .article-card { background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 20px; overflow: hidden; transition: all 0.4s ease; cursor: pointer; }
        .article-card:hover { transform: translateY(-5px); box-shadow: 0 20px 50px var(--shadow); }
        .article-image { height: 180px; background: var(--gradient-2); display: flex; align-items: center; justify-content: center; font-size: 4rem; color: white; position: relative; }
        .article-category { position: absolute; top: 1rem; left: 1rem; padding: 0.4rem 1rem; background: var(--accent); color: var(--text-dark); font-size: 0.75rem; font-weight: 600; border-radius: 50px; }
        .article-status { position: absolute; top: 1rem; right: 1rem; padding: 0.4rem 1rem; font-size: 0.75rem; font-weight: 600; border-radius: 50px; }
        .article-status.pending { background: var(--warning); color: white; }
        .article-status.approved { background: var(--success); color: white; }
        .article-status.rejected { background: var(--danger); color: white; }
        .article-content { padding: 1.5rem; }
        .article-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; font-weight: 600; color: var(--text-dark); margin-bottom: 0.5rem; line-height: 1.4; }
        .article-excerpt { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .article-meta { display: flex; justify-content: space-between; align-items: center; padding-top: 1rem; border-top: 1px solid var(--glass-border); }
        .article-author { display: flex; align-items: center; gap: 0.5rem; }
        .author-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--gradient-1); display: flex; align-items: center; justify-content: center; color: white; font-size: 0.75rem; font-weight: 600; }
        .author-name { font-size: 0.85rem; font-weight: 500; color: var(--text-dark); }
        .article-stats { display: flex; gap: 1rem; }
        .stat { display: flex; align-items: center; gap: 0.3rem; font-size: 0.85rem; color: var(--text-muted); }
        .create-article-container { max-width: 800px; margin: 0 auto; background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 24px; padding: 2rem; }
        .form-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.8rem; font-weight: 700; color: var(--text-dark); margin-bottom: 2rem; text-align: center; }
        .form-group { margin-bottom: 1.5rem; }
        .form-label { display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-dark); margin-bottom: 0.5rem; }
        .form-input, .form-textarea, .form-select { width: 100%; padding: 1rem; border: 2px solid var(--glass-border); border-radius: 12px; font-size: 1rem; font-family: inherit; background: white; transition: all 0.3s ease; }
        .form-input:focus, .form-textarea:focus, .form-select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(45, 106, 79, 0.1); }
        .form-textarea { min-height: 200px; resize: vertical; }
        .submit-btn { width: 100%; padding: 1rem; background: var(--gradient-1); color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(45, 106, 79, 0.3); }
        .admin-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 1.5rem; text-align: center; }
        .stat-value { font-family: 'Space Grotesk', sans-serif; font-size: 2.5rem; font-weight: 700; color: var(--primary); }
        .stat-label { font-size: 0.9rem; color: var(--text-muted); margin-top: 0.5rem; }
        .pending-list { display: flex; flex-direction: column; gap: 1rem; }
        .pending-item { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .pending-info { flex: 1; }
        .pending-info h4 { font-size: 1.1rem; color: var(--text-dark); margin-bottom: 0.3rem; }
        .pending-info p { font-size: 0.85rem; color: var(--text-muted); }
        .pending-actions { display: flex; gap: 0.5rem; }
        .action-btn { padding: 0.5rem 1rem; border-radius: 50px; border: none; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .action-btn.approve { background: var(--success); color: white; }
        .action-btn.reject { background: var(--danger); color: white; }
        .action-btn:hover { transform: scale(1.05); }
        .profile-container { max-width: 800px; margin: 0 auto; }
        .profile-header { background: var(--gradient-2); border-radius: 24px; padding: 3rem 2rem; text-align: center; color: white; position: relative; overflow: hidden; }
        .profile-avatar { width: 120px; height: 120px; border-radius: 50%; background: white; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; font-size: 3rem; position: relative; z-index: 1; }
        .profile-name { font-family: 'Space Grotesk', sans-serif; font-size: 1.8rem; font-weight: 700; position: relative; z-index: 1; }
        .profile-bio { font-size: 1rem; opacity: 0.9; margin-top: 0.5rem; position: relative; z-index: 1; }
        .profile-stats { display: flex; justify-content: center; gap: 3rem; margin-top: 2rem; position: relative; z-index: 1; }
        .profile-stat { text-align: center; }
        .profile-stat-value { font-size: 1.5rem; font-weight: 700; }
        .profile-stat-label { font-size: 0.85rem; opacity: 0.8; }
        .article-detail { max-width: 800px; margin: 0 auto; }
        .article-detail-header { text-align: center; margin-bottom: 2rem; }
        .article-detail-category { display: inline-block; padding: 0.5rem 1.5rem; background: var(--gradient-1); color: white; border-radius: 50px; font-size: 0.85rem; font-weight: 600; margin-bottom: 1rem; }
        .article-detail-title { font-family: 'Space Grotesk', sans-serif; font-size: 2.5rem; font-weight: 700; color: var(--text-dark); line-height: 1.3; margin-bottom: 1rem; }
        .article-detail-meta { display: flex; justify-content: center; align-items: center; gap: 2rem; color: var(--text-muted); }
        .article-detail-author { display: flex; align-items: center; gap: 0.5rem; }
        .article-detail-content { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 24px; padding: 2rem; margin-bottom: 2rem; line-height: 1.8; font-size: 1.05rem; }
        .article-actions { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem; }
        .article-action-btn { padding: 0.8rem 2rem; border-radius: 50px; border: none; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 0.5rem; }
        .article-action-btn.like { background: var(--gradient-1); color: white; }
        .article-action-btn.comment { background: var(--bg-sand); color: var(--text-dark); }
        .article-action-btn:hover { transform: scale(1.05); }
        .comments-section { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 24px; padding: 2rem; }
        .comments-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.3rem; font-weight: 600; color: var(--text-dark); margin-bottom: 1.5rem; }
        .comment-form { margin-bottom: 2rem; }
        .comment-input { width: 100%; padding: 1rem; border: 2px solid var(--glass-border); border-radius: 16px; font-size: 1rem; font-family: inherit; resize: vertical; min-height: 100px; }
        .comment-input:focus { outline: none; border-color: var(--primary); }
        .comment-submit { margin-top: 1rem; padding: 0.8rem 2rem; background: var(--gradient-1); color: white; border: none; border-radius: 50px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
        .comments-list { display: flex; flex-direction: column; gap: 1rem; }
        .comment-item { display: flex; gap: 1rem; padding: 1rem; background: white; border-radius: 16px; }
        .comment-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--gradient-1); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; flex-shrink: 0; }
        .comment-content { flex: 1; }
        .comment-author { font-weight: 600; color: var(--text-dark); margin-bottom: 0.3rem; }
        .comment-text { font-size: 0.95rem; color: var(--text-muted); line-height: 1.6; }
        .comment-time { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.5rem; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 1rem; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--bg-cream); border-radius: 24px; padding: 2rem; max-width: 450px; width: 100%; position: relative; }
        .modal-close { position: absolute; top: 1rem; right: 1rem; width: 40px; height: 40px; border-radius: 50%; background: var(--bg-sand); border: none; cursor: pointer; font-size: 1.2rem; transition: all 0.3s ease; }
        .modal-close:hover { background: var(--danger); color: white; }
        .modal-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.8rem; font-weight: 700; color: var(--text-dark); text-align: center; margin-bottom: 1.5rem; }
        .auth-form .form-group { margin-bottom: 1rem; }
        .auth-form .submit-btn { margin-top: 1rem; }
        .auth-switch { text-align: center; margin-top: 1rem; font-size: 0.9rem; color: var(--text-muted); }
        .auth-switch a { color: var(--primary); cursor: pointer; font-weight: 600; }
        .notifications-dropdown { position: absolute; top: 100%; right: 0; width: 350px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; box-shadow: 0 20px 60px var(--shadow); display: none; max-height: 400px; overflow-y: auto; }
        .notifications-dropdown.active { display: block; }
        .notification-item { padding: 1rem; border-bottom: 1px solid var(--glass-border); cursor: pointer; transition: background 0.3s ease; }
        .notification-item:hover { background: var(--bg-sand); }
        .notification-item:last-child { border-bottom: none; }
        .notification-text { font-size: 0.9rem; color: var(--text-dark); }
        .notification-time { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.3rem; }
        .toast { position: fixed; bottom: 2rem; right: 2rem; padding: 1rem 2rem; background: var(--gradient-1); color: white; border-radius: 12px; font-weight: 500; box-shadow: 0 10px 40px var(--shadow); transform: translateY(100px); opacity: 0; transition: all 0.4s ease; z-index: 3000; }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.error { background: var(--danger); }
        .toast.success { background: var(--success); }
        .loading { text-align: center; padding: 3rem; color: var(--text-muted); }
        .loading-spinner { width: 40px; height: 40px; border: 4px solid var(--bg-sand); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
        .empty-state-icon { font-size: 4rem; margin-bottom: 1rem; }
        .empty-state-title { font-size: 1.5rem; font-weight: 600; color: var(--text-dark); margin-bottom: 0.5rem; }
        .empty-state-text { font-size: 0.95rem; }
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .feed-header { flex-direction: column; align-items: flex-start; }
            .articles-grid { grid-template-columns: 1fr; }
            .profile-stats { gap: 1.5rem; }
            .article-detail-title { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo" onclick="showPage('feed')"><span class="logo-icon">🌿</span>GreenPedia</div>
        <div class="nav-links">
            <button class="nav-btn active" onclick="showPage('feed')">Feed</button>
            <button class="nav-btn" onclick="showPage('create')">Write Article</button>
            <button class="nav-btn" onclick="showPage('profile')">My Profile</button>
            <button class="nav-btn" id="adminBtn" style="display:none;" onclick="showPage('admin')">Admin</button>
        </div>
        <div class="nav-right">
            <div style="position:relative;">
                <button class="notification-btn" onclick="toggleNotifications()">🔔<span class="notification-badge" id="notifBadge" style="display:none;">0</span></button>
                <div class="notifications-dropdown" id="notificationsDropdown"></div>
            </div>
            <div id="authButtons">
                <button class="nav-btn" onclick="showAuthModal('login')">Login</button>
                <button class="nav-btn primary" onclick="showAuthModal('register')">Sign Up</button>
            </div>
            <div id="userMenu" style="display:none;"><div class="user-avatar" id="userAvatar" onclick="showPage('profile')">U</div></div>
        </div>
    </nav>

    <div class="main-container">
        <div id="feedPage" class="page active">
            <div class="feed-header">
                <h1 class="feed-title">Eco News Feed</h1>
                <div class="feed-filters">
                    <button class="filter-btn active" onclick="filterArticles('all')">All</button>
                    <button class="filter-btn" onclick="filterArticles('climate')">🌱 Climate</button>
                    <button class="filter-btn" onclick="filterArticles('energy')">⚡ Energy</button>
                    <button class="filter-btn" onclick="filterArticles('wildlife')">🦋 Wildlife</button>
                    <button class="filter-btn" onclick="filterArticles('food')">🥗 Food</button>
                </div>
            </div>
            <div class="articles-grid" id="articlesGrid"></div>
        </div>

        <div id="createPage" class="page">
            <div class="create-article-container">
                <h2 class="form-title">✍️ Write an Article</h2>
                <form class="auth-form" id="articleForm">
                    <div class="form-group">
                        <label class="form-label">Title</label>
                        <input type="text" class="form-input" id="articleTitle" placeholder="Enter article title" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Category</label>
                        <select class="form-select" id="articleCategory">
                            <option value="climate">Climate Change</option>
                            <option value="energy">Renewable Energy</option>
                            <option value="wildlife">Wildlife Conservation</option>
                            <option value="food">Sustainable Food</option>
                            <option value="general">General</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Content</label>
                        <textarea class="form-textarea" id="articleContent" placeholder="Write your article content here..." required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Submit for Review</button>
                </form>
            </div>
        </div>

        <div id="adminPage" class="page">
            <div class="feed-title" style="margin-bottom:2rem;">🛡️ Admin Dashboard</div>
            <div class="admin-stats">
                <div class="stat-card"><div class="stat-value" id="statUsers">0</div><div class="stat-label">Total Users</div></div>
                <div class="stat-card"><div class="stat-value" id="statArticles">0</div><div class="stat-label">Published Articles</div></div>
                <div class="stat-card"><div class="stat-value" id="statPending">0</div><div class="stat-label">Pending Approval</div></div>
            </div>
            <h2 class="feed-title" style="font-size:1.5rem;margin-bottom:1rem;">📋 Pending Articles</h2>
            <div class="pending-list" id="pendingList"></div>
        </div>

        <div id="profilePage" class="page">
            <div class="profile-container">
                <div class="profile-header">
                    <div class="profile-avatar" id="profileAvatar">U</div>
                    <h2 class="profile-name" id="profileName">User</h2>
                    <p class="profile-bio" id="profileBio">Eco enthusiast</p>
                    <div class="profile-stats">
                        <div class="profile-stat"><div class="profile-stat-value" id="profileArticles">0</div><div class="profile-stat-label">Articles</div></div>
                        <div class="profile-stat"><div class="profile-stat-value" id="profileFollowers">0</div><div class="profile-stat-label">Followers</div></div>
                        <div class="profile-stat"><div class="profile-stat-value" id="profileFollowing">0</div><div class="profile-stat-label">Following</div></div>
                    </div>
                </div>
                <div class="articles-grid" id="userArticlesGrid" style="margin-top:2rem;"></div>
            </div>
        </div>

        <div id="articlePage" class="page">
            <div class="article-detail" id="articleDetail"></div>
        </div>
    </div>

    <div class="modal-overlay" id="authModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('authModal')">✕</button>
            <h2 class="modal-title" id="authTitle">Login</h2>
            <form class="auth-form" id="authForm">
                <div class="form-group" id="usernameGroup" style="display:none;">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-input" id="authUsername" placeholder="Choose username">
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="text" class="form-input" id="authUser" placeholder="Enter email" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" id="authPassword" placeholder="Enter password" required>
                </div>
                <button type="submit" class="submit-btn" id="authSubmit">Login</button>
            </form>
            <p class="auth-switch"><span id="authSwitchText">Don't have an account?</span> <a onclick="toggleAuthMode()" id="authSwitchLink">Sign Up</a></p>
        </div>
    </div>

    <div class="toast" id="toast">Message</div>

    <script>
        let currentUser = null;
        let currentPage = 'feed';
        let currentFilter = 'all';
        let isLoginMode = true;

        async function apiCall(url, options = {}) {
            try { const res = await fetch(url, options); return await res.json(); } catch (error) { return { error: 'Connection failed' }; }
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function showPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(page + 'Page').classList.add('active');
            const btn = document.querySelector(`.nav-btn[onclick="showPage('${page}')"]`);
            if (btn) btn.classList.add('active');
            currentPage = page;
            if (page === 'feed') loadArticles();
            if (page === 'profile' && currentUser) loadUserProfile();
            if (page === 'admin' && currentUser?.is_admin == 1) loadAdminData();
            if (page === 'create' && !currentUser) { showToast('Please login to write articles', 'error'); showPage('feed'); }
        }

        function showAuthModal(mode) { document.getElementById('authModal').classList.add('active'); isLoginMode = mode === 'login'; updateAuthForm(); }
        function toggleAuthMode() { isLoginMode = !isLoginMode; updateAuthForm(); }
        function updateAuthForm() {
            document.getElementById('authTitle').textContent = isLoginMode ? 'Login' : 'Sign Up';
            document.getElementById('authSubmit').textContent = isLoginMode ? 'Login' : 'Sign Up';
            document.getElementById('usernameGroup').style.display = isLoginMode ? 'none' : 'block';
            document.getElementById('authSwitchText').textContent = isLoginMode ? "Don't have an account?" : 'Already have an account?';
            document.getElementById('authSwitchLink').textContent = isLoginMode ? 'Sign Up' : 'Login';
        }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        async function register(username, email, password) { return await apiCall('auth.php?action=register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, email, password }) }); }
        async function login(username, password) { return await apiCall('auth.php?action=login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) }); }

        function updateAuthUI() {
            const authButtons = document.getElementById('authButtons');
            const userMenu = document.getElementById('userMenu');
            const adminBtn = document.getElementById('adminBtn');
            if (currentUser) {
                authButtons.style.display = 'none';
                userMenu.style.display = 'block';
                document.getElementById('userAvatar').textContent = currentUser.username.charAt(0).toUpperCase();
                if (currentUser.is_admin == 1) adminBtn.style.display = 'block';
                loadNotifications();
            } else { authButtons.style.display = 'flex'; userMenu.style.display = 'none'; adminBtn.style.display = 'none'; }
        }

        async function loadArticles() {
            const grid = document.getElementById('articlesGrid');
            grid.innerHTML = '<div class="loading"><div class="loading-spinner"></div>Loading...</div>';
            try {
                let url = 'api.php?action=get_articles&status=approved';
                if (currentFilter !== 'all') url += '&category=' + currentFilter;
                const data = await apiCall(url);
                const articles = data.articles || [];
                if (articles.length === 0) { grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📰</div><h3 class="empty-state-title">No Articles</h3><p class="empty-state-text">Be the first to write!</p></div>'; return; }
                grid.innerHTML = articles.map(a => `<div class="article-card" onclick="viewArticle(${a.id})"><div class="article-image" style="background:${getCategoryColor(a.category)}">${getCategoryEmoji(a.category)}</div><div class="article-content"><h3 class="article-title">${a.title}</h3><p class="article-excerpt">${a.content.substring(0,150)}...</p><div class="article-meta"><div class="article-author"><div class="author-avatar">${a.username?.charAt(0).toUpperCase()||'U'}</div><span class="author-name">${a.username||'Anonymous'}</span></div><div class="article-stats"><span class="stat">❤️ ${countLikes(a.likes)}</span><span class="stat">👁️ ${a.views}</span></div></div></div></div>`).join('');
            } catch (error) { grid.innerHTML = '<div class="loading">Failed to load</div>'; }
        }

        function countLikes(s) { try { return JSON.parse(s||'[]').length; } catch { return 0; } }
        function getCategoryColor(c) { const m={climate:'linear-gradient(135deg,#2d6a4f,#52b788)',energy:'linear-gradient(135deg,#d4a373,#e9c46a)',wildlife:'linear-gradient(135deg,#4361ee,#7209b7)',food:'linear-gradient(135deg,#f72585,#ff6b6b)',general:'linear-gradient(135deg,#1b4332,#2d6a4f)'}; return m[c]||m.general; }
        function getCategoryEmoji(c) { const m={climate:'🌍',energy:'⚡',wildlife:'🦋',food:'🥗',general:'📚'}; return m[c]||'📚'; }

        function filterArticles(f) { currentFilter = f; document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); event.target.classList.add('active'); loadArticles(); }

        async function viewArticle(id) {
            try {
                const data = await apiCall('api.php?action=get_article&id=' + id);
                if (data.error) { showToast(data.error,'error'); return; }
                const a = data.article;
                const likes = JSON.parse(a.likes||'[]');
                const isLiked = currentUser && likes.includes(currentUser.id);
                document.getElementById('articleDetail').innerHTML = `<div class="article-detail-header"><span class="article-detail-category">${(a.category||'general').toUpperCase()}</span><h1 class="article-detail-title">${a.title}</h1><div class="article-detail-meta"><div class="article-detail-author"><div class="author-avatar" style="width:40px;height:40px;font-size:1rem;">${a.username?.charAt(0).toUpperCase()}</div><span>${a.username}</span></div><span>•</span><span>${new Date(a.created_at).toLocaleDateString()}</span><span>•</span><span>${a.views} views</span></div></div><div class="article-actions"><button class="article-action-btn like" onclick="likeArticle(${a.id})">${isLiked?'❤️ Liked':'🤍 Like'}</button><button class="article-action-btn comment" onclick="document.getElementById('commentInput')?.focus()">💬 Comment</button></div><div class="article-detail-content">${a.content}</div><div class="comments-section"><h3 class="comments-title">💬 Comments</h3><div class="comment-form"><textarea class="comment-input" id="commentInput" placeholder="Write a comment..."></textarea><button class="comment-submit" onclick="addComment(${a.id})">Post Comment</button></div><div class="comments-list" id="commentsList"></div></div>`;
                loadComments(id);
                showPage('article');
            } catch (error) { showToast('Failed to load article','error'); }
        }

        async function likeArticle(id) {
            if (!currentUser) { showToast('Please login','error'); return; }
            const data = await apiCall('api.php?action=like_article', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({article_id:id,user_id:currentUser.id}) });
            if (data.success) { viewArticle(id); showToast(data.liked?'Liked!':'Like removed','success'); }
        }

        async function loadComments(id) {
            const data = await apiCall('comments.php?action=get_comments&article_id=' + id);
            const c = data.comments||[];
            document.getElementById('commentsList').innerHTML = c.map(x => `<div class="comment-item"><div class="comment-avatar">${x.username?.charAt(0).toUpperCase()||'U'}</div><div class="comment-content"><div class="comment-author">${x.username}</div><div class="comment-text">${x.content}</div><div class="comment-time">${new Date(x.created_at).toLocaleDateString()}</div></div></div>`).join('') || '<p style="color:var(--text-muted);text-align:center;">No comments yet</p>';
        }

        async function addComment(id) {
            if (!currentUser) { showToast('Please login','error'); return; }
            const content = document.getElementById('commentInput').value.trim();
            if (!content) return;
            const data = await apiCall('comments.php?action=add_comment', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({article_id:id,user_id:currentUser.id,content}) });
            if (data.message) { document.getElementById('commentInput').value = ''; loadComments(id); showToast('Comment added!','success'); }
        }

        document.getElementById('articleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) { showToast('Please login','error'); return; }
            const data = await apiCall('api.php?action=create_article', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({user_id:currentUser.id,title:document.getElementById('articleTitle').value,category:document.getElementById('articleCategory').value,content:document.getElementById('articleContent').value}) });
            if (data.message) { showToast('Article submitted for review!','success'); e.target.reset(); showPage('profile'); }
            else showToast(data.error||'Failed to submit','error');
        });

        async function loadUserProfile() {
            if (!currentUser) return;
            document.getElementById('profileName').textContent = currentUser.username;
            document.getElementById('profileBio').textContent = currentUser.bio || 'Eco enthusiast';
            document.getElementById('profileAvatar').textContent = currentUser.username.charAt(0).toUpperCase();
            const followers = JSON.parse(currentUser.followers||'[]');
            const following = JSON.parse(currentUser.following||'[]');
            document.getElementById('profileFollowers').textContent = followers.length;
            document.getElementById('profileFollowing').textContent = following.length;
            loadUserArticles();
        }

        async function loadUserArticles() {
            if (!currentUser) return;
            const grid = document.getElementById('userArticlesGrid');
            const data = await apiCall('api.php?action=get_articles&user_id=' + currentUser.id);
            const articles = data.articles||[];
            if (articles.length === 0) { grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">✍️</div><h3 class="empty-state-title">No Articles</h3><p class="empty-state-text">Share your eco knowledge!</p></div>'; return; }
            grid.innerHTML = articles.map(a => `<div class="article-card" onclick="viewArticle(${a.id})"><div class="article-image" style="background:${getCategoryColor(a.category)}">${getCategoryEmoji(a.category)}<span class="article-status ${a.status}">${a.status}</span></div><div class="article-content"><h3 class="article-title">${a.title}</h3><p class="article-excerpt">${a.content.substring(0,150)}...</p><div class="article-meta"><span class="author-name">${a.status==='pending'?'⏳ Awaiting approval':'✅ Published'}</span><div class="article-stats"><span class="stat">❤️ ${countLikes(a.likes)}</span></div></div></div></div>`).join('');
        }

        async function loadAdminData() {
            const stats = await apiCall('api.php?action=get_stats');
            document.getElementById('statUsers').textContent = stats.users||0;
            document.getElementById('statArticles').textContent = stats.articles||0;
            document.getElementById('statPending').textContent = stats.pending||0;
            const data = await apiCall('api.php?action=get_articles&status=pending');
            const articles = data.articles||[];
            if (articles.length === 0) { document.getElementById('pendingList').innerHTML = '<div class="empty-state"><div class="empty-state-icon">✅</div><h3 class="empty-state-title">All Caught Up!</h3><p class="empty-state-text">No pending articles</p></div>'; return; }
            document.getElementById('pendingList').innerHTML = articles.map(a => `<div class="pending-item"><div class="pending-info"><h4>${a.title}</h4><p>By ${a.username} • ${new Date(a.created_at).toLocaleDateString()}</p></div><div class="pending-actions"><button class="action-btn approve" onclick="approveArticle(${a.id})">✓ Approve</button><button class="action-btn reject" onclick="rejectArticle(${a.id})">✕ Reject</button></div></div>`).join('');
        }

        async function approveArticle(id) {
            const data = await apiCall('api.php?action=update_article', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id,user_id:currentUser.id,status:'approved'}) });
            if (data.message) { showToast('Article approved!','success'); loadAdminData(); }
        }

        async function rejectArticle(id) {
            const data = await apiCall('api.php?action=update_article', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id,user_id:currentUser.id,status:'rejected'}) });
            if (data.message) { showToast('Article rejected','info'); loadAdminData(); }
        }

        async function loadNotifications() {
            if (!currentUser) return;
            const data = await apiCall('notifications.php?action=get_notifications&user_id=' + currentUser.id);
            const notifs = data.notifications||[];
            const badge = document.getElementById('notifBadge');
            const unread = notifs.filter(n => n.read_status==0).length;
            badge.style.display = unread>0?'flex':'none';
            badge.textContent = unread;
            document.getElementById('notificationsDropdown').innerHTML = notifs.slice(0,10).map(n => `<div class="notification-item"><div class="notification-text">${n.message}</div><div class="notification-time">${new Date(n.created_at).toLocaleDateString()}</div></div>`).join('') || '<div style="padding:1rem;text-align:center;color:var(--text-muted);">No notifications</div>';
        }

        function toggleNotifications() { document.getElementById('notificationsDropdown').classList.toggle('active'); }

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('authUser').value;
            const password = document.getElementById('authPassword').value;
            try {
                if (isLoginMode) {
                    const data = await login(username, password);
                    if (data.user) { currentUser = data.user; showToast('Welcome back!','success'); closeModal('authModal'); updateAuthUI(); showPage('feed'); }
                    else showToast(data.error||'Login failed','error');
                } else {
                    const newUsername = document.getElementById('authUsername').value;
                    const data = await register(newUsername, username, password);
                    if (data.message) { showToast('Account created! Please login.','success'); toggleAuthMode(); }
                    else showToast(data.error||'Registration failed','error');
                }
            } catch (error) { showToast('An error occurred','error'); }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.notification-btn') && !e.target.closest('.notifications-dropdown')) {
                document.getElementById('notificationsDropdown').classList.remove('active');
            }
        });

        loadArticles();
    </script>
</body>
</html>
